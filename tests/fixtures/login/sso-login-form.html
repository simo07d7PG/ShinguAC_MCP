    <script type="text/javascript">
    	$(document).ready(function() {
            //아이디 찾기
            $(document).on("click", "button[data-role=findId]", function(){
            	window.location.href="/login/findId/idStep1";
            });
            
            //비밀번호 찾기
            $(document).on("click", "button[data-role=findPw]", function(){
            	window.location.href="/login/findPw/pwStep1";
            }); 
            
            //회원가입
            $(document).on("click", "button[data-role=joinMember]", function(){
            	window.location.href="/member/userGb";
            });
            
            //자동로그인 유지 체크박스 클릭
            $("#keepLogIn").on("click",function(){
            	var msg = "[자동로그인 주의사항]\n아이디/패스워드 인증상태가 유지됩니다. (2차인증은 제외)\n개인정보보호를 위해 비밀번호, 패턴설정 등을 통해 모바일기기의 보안에 유의하세요.\n\n\n"
            	+"[로그인 상태 유지 해제방법]\n로그아웃을 클릭하시면, 자동로그인은 해제됩니다.";
            	alert(msg);
            }); 
             
        	// 저장된 쿠키값을 가져와서 ID 칸에 넣어준다. 없으면 공백으로 들어감.
            var userInputId = getCookie("userInputId");
        	if(userInputId != ""&&userInputId != '""'){
            	$("input[name='userId']").val(userInputId);
        	}
             
            if($("input[name='userId']").val() != ""){ // 그 전에 ID를 저장해서 처음 페이지 로딩 시, 입력 칸에 저장된 ID가 표시된 상태라면,
                $("#idSaveCheck").attr("checked", true); // ID 저장하기를 체크 상태로 두기.
                $("#idSaveCheck").closest("label").children("i").removeClass("fa-square-o").addClass("fa-check-square-o");
            }
            // 자동로그인부분 시작
			if(false){
				
				var savePwd = getCookie("savePwd");

				var savePwdHead = savePwd.substring(0,1);
				var savePwdTail = savePwd.substring(savePwd.length-1);

				if(savePwdHead == '"' && savePwdTail == '"'){
					savePwd = savePwd.substring(1,savePwd.length-1);
				}
				
				if(savePwd != ""&&savePwd != '""'){
		            $("input[name='password']").val(savePwd);
				}
	            if( $("input[name='password']").val() != ""){
	            	
	            	$("#idSaveCheck").attr("checked", true); // ID 저장하기를 체크 상태로 두기.
	                $("#idSaveCheck").closest("label").children("i").removeClass("fa-square-o").addClass("fa-check-square-o");
	                $("#keepLogIn").attr("checked", true); // 자동로그인을 체크 상태로 두기.
	                $("#keepLogIn").closest("label").children("i").removeClass("fa-square-o").addClass("fa-check-square-o");
	                
	                $("#loginButton").click();
	            }
	            
			}
			// 자동로그인부분 끝
            

            
            $("input[name=userId]").keydown(function (key) {
                if(key.keyCode == 13){
                   $("#password").focus();
                }
            });
        });

 

    	function formSubmit(){
    		if(!$.trim($("input[name=userId]").val())){
                toastr.error("아이디를 입력해주세요.");
                return false;
            }
            if(!$.trim($("input[name=password]").val())){ 
                toastr.error("비밀번호를 입력해주세요.");
                return false;
            }
            
            if($("#idSaveCheck").is(":checked")){ 
				var userInputId = $("input[name='userId']").val();
                setCookie("userInputId", userInputId, 7); // 7일 동안 쿠키 보관
            } else {
            	setCookie("userInputId", "", 0); 
            }
            $("input[name=userId]").val($("input[name=userId]").val().trim());
            return true;
    	}
         
    	function setCookie(cookieName, value, exdays){
            var exdate = new Date();
            exdate.setDate(exdate.getDate() + exdays);
            var cookieValue = escape(value) + ((exdays==null) ? "" : "; expires=" + exdate.toGMTString());
            document.cookie = cookieName + "=" + cookieValue;
        }
         
        function deleteCookie(cookieName){
            var expireDate = new Date();
            expireDate.setDate(expireDate.getDate() - 1);
            document.cookie = cookieName + "= " + "; expires=" + expireDate.toGMTString();
        }
         
        function getCookie(cookieName) {
            cookieName = cookieName + '=';
            var cookieData = document.cookie;
            var start = cookieData.indexOf(cookieName);
            var cookieValue = '';
            if(start != -1){
                start += cookieName.length;
                var end = cookieData.indexOf(';', start);
                if(end == -1)end = cookieData.length;
                cookieValue = cookieData.substring(start, end);
            }
            return unescape(cookieValue);
        }
        
        function caps_lock(e) {
            var keyCode = 0;
            var shiftKey = false;
            keyCode = e.keyCode;
            shiftKey = e.shiftKey;
            if (((keyCode >= 65 && keyCode <= 90) && !shiftKey)
                    || ((keyCode >= 97 && keyCode <= 122) && shiftKey)) {
            	toastr.remove();
            	toastr.error("CapsLock이 켜져있습니다.");
            	//document.getElementById("isCapslock").value = "Y";
            }
        }
     
    </script>
