<form name="ssoRedFrm" id="ssoRedFrm" method="post" action="https://login.shingu.ac.kr/index"> 
 	<input type="hidden" name="loginType" 	id="loginType" value=""/>
 	<input type="hidden" name="param1" 		id="param1" value=""/>
 	<input type="hidden" name="param2" 		id="param2" value=""/>
 	<input type="hidden" name="param3" 		id="param3" value=""/>
</form>
<script type="text/javascript">
	$(document).ready(function() {
		var duplicateLogin = "";
		var returnType = "";
		var autoLoginYN = "null";
		
		if(returnType == 'A'){
			$("#param1").val("acceptUrl");
			//var param2 = encodeURIComponent('http://testportal.shingu.ac.kr:8080/ADM/AOY/AOY007P?yy='+''+'&haggi='+''+'&gwajeongCd='+'');
			var param2 = encodeURIComponent('https://student.shingu.ac.kr/ADM/AOY/AOY007P?yy='+''+'&haggi='+''+'&gwajeongCd='+'');
			$("#param2").val(param2);
			$("#ssoRedFrm").submit();
		}else if(returnType == 'B'){
//			var param2 = encodeURIComponent('http://testportal.shingu.ac.kr:8080/ADM/AGJ/AGJ002P?yeonsuNo='+'');
			var param2 = encodeURIComponent('https://student.shingu.ac.kr/ADM/AGJ/AGJ002P?yeonsuNo='+'');
			$("#param1").val("acceptUrl");
			$("#param2").val(param2);
			$("#ssoRedFrm").submit();
		}else{
			if(duplicateLogin == 'Y'){
				alert("중복로그인으로 현재 세션이 종료되었습니다.");
				$("#ssoRedFrm").submit();
			}else{
				// alert("세션이 종료되었습니다.");
				if(autoLoginYN=='N'){
					window.location.href = "https://login.shingu.ac.kr/logout";
				} else {
					$("#ssoRedFrm").submit();					
				}
			}
		}
		
	});
</script>
