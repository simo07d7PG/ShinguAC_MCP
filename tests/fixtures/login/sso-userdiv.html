<form name="ssoLoginFrm" id="ssoLoginFrm" method="post">
	<input type="hidden" name="ReturnUrl" 	id="ReturnUrl"/>
	<input type="hidden" name="userId" 		id="userId"/>
	<input type="hidden" name="password" 	id="password"/>
	<input type="hidden" name="_method" 	id="_method"/>
	<input type="hidden" name="loginType" 	id="loginType"/>
	<input type="hidden" name="param1" 		id="param1"/>
	<input type="hidden" name="param2" 		id="param2"/>
	<input type="hidden" name="param3" 		id="param3"/>
</form>
<script type="text/javascript">
    var userGb = "2";
    	
    var returnUrl = "";
  	var loginType = "";
  	var param1 = "";
  	var param2 = "";
  	var param3 = "";
 
  	var userId = "2000000000";

</script>
<script type = "text/javascript">
		var url = "";
	    if($.trim(returnUrl)){
	    	if(returnUrl.indexOf('student.shingu.ac.kr')){ 				//학생포탈 URL일경우
	        	$("form[name=ssoLoginFrm] input[name=loginType]").val(loginType);	
	      		$("form[name=ssoLoginFrm] input[name=ReturnUrl]").val(returnUrl);	
	      		$("form[name=ssoLoginFrm] input[name=param1]").val(param1);	
	      		$("form[name=ssoLoginFrm] input[name=param2]").val(param2);	
	      		$("form[name=ssoLoginFrm] input[name=param3]").val(param3);	
	      		$("form[name=ssoLoginFrm] input[name=_method]").val("post");	
	    		$("form[name=ssoLoginFrm]").attr("action","https://student.shingu.ac.kr/ssoLogin");
	    		$("form[name=ssoLoginFrm]").submit();    		
	    	}else{
		    	window.location.href = returnUrl;
	    	}
	    }else{
		  	if(userGb == '2'){ 				//학생일 경우 학생포탈로 이동
		  		$("form[name=ssoLoginFrm] input[name=loginType]").val(loginType);	
		  		$("form[name=ssoLoginFrm] input[name=param1]").val(param1);	
		  		$("form[name=ssoLoginFrm] input[name=param2]").val(param2);	
		  		$("form[name=ssoLoginFrm] input[name=param3]").val(param3);	
					$("form[name=ssoLoginFrm]").attr("action","https://student.shingu.ac.kr/ssoLogin");
					$("form[name=ssoLoginFrm]").submit();
		    } else if(userGb == '5') { // 평생교육원강사	
		    	window.location.href = "https://gate.shingu.ac.kr/page/ssoLogin";
	    	}  else if(userGb == '6') {  //학점은행제 학생
				window.location.href = "https://gate.shingu.ac.kr/page/ssoLogin";

	    	} else {
		    	var jigjongGb = "";

		    	if (userGb == '9'){ 
 						window.location.href = "https://gate.shingu.ac.kr/page/ssoLogin";	 		    		
		    	}
		    	else if(jigjongGb == '14' || jigjongGb == '17' || jigjongGb == '16'){			/* 시간강사 : 17, 겸임교원 : 14, 강사:16*/
		    		//inst로 넘어올때 쿠키에서 JSESSIONID가 tomcat7로 넘어오면서 웹스퀘어로 로그인되는 상황이 발생하여 tomcat6으로 강제변환(2020.90.00)
		    				    		
		    		window.location.href = "https://gate.shingu.ac.kr/page/ssoLogin";
		    		//이원학(2020.90.00) - 평생계정문제로 코드추가, 2차인증을 거치면 userGb값이 1로 넘어옴
		    	}
		    	else{
		    		window.location.href = "https://gw.shingu.ac.kr/DeskPlusEIP/site/SiteShingu/base/Authentication/SmartSSO.aspx";
		    	}
		    }
	    }
 		</script>
